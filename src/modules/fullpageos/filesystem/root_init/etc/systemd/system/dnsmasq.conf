interface=wlan0                # Serve only on wlan0
bind-interfaces               # Bind to interface, not wildcard

dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h  # IP range
dhcp-option=3,192.168.4.1      # Gateway (the Pi)
dhcp-option=6,192.168.4.1      # DNS server (the Pi)
address=/#/192.168.4.1         # Redirect all DNS queries to the Pi (captive behavior)

domain-needed
bogus-priv
no-resolv
