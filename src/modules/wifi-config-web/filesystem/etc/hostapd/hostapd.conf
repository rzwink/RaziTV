interface=wlan0               # Wireless interface name
driver=nl80211                # Required for most modern WiFi chips
ssid=RaziTV-Setup             # Name of the access point
hw_mode=g                     # 2.4GHz band (use 'a' for 5GHz if supported)
channel=6                     # WiFi channel
wmm_enabled=0                 # Disable WMM QoS (OK unless you need media streaming)
auth_algs=1                   # Only open authentication
ignore_broadcast_ssid=0      # 0 = visible SSID, 1 = hidden

# ✅ Required for Raspberry Pi in many countries
country_code=US              # Use your 2-letter country code here
