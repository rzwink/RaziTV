<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Configure WiFi</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 2em 3em;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      margin-bottom: 1.5em;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 1em;
      font-weight: bold;
      text-align: left;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75em;
      margin-top: 0.25em;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
      box-sizing: border-box;
    }

    button {
      margin-top: 1.5em;
      background: #007bff;
      color: white;
      border: none;
      padding: 0.75em 2em;
      font-size: 1em;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Configure WiFi</h1>
    <form method="POST" action="/wifi-submit.sh">
      <label for="ssid">SSID
        <input type="text" name="ssid" id="ssid" required />
      </label>
      <label for="password">Password
        <input type="password" name="password" id="password" required />
      </label>
      <button type="submit">Connect</button>
    </form>
  </div>
</body>
</html>
